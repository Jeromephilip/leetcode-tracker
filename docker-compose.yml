version: '3.8'

services:
  db:
    image: postgres
    container_name: leetcode-postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: leetcode
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: